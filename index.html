<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photos historiques swisstopo</title>

  <!-- Chargement des librairies css -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />

  <!-- Chargement scripts js -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chargement des données (généré par convertir_donnees.py) -->
  <script src="data_photos.js"></script>
</head>

<body>
  <header>
    <h1>Photos historiques swisstopo</h1>
    <h2>Cliquer sur un point pour afficher les informations de la photo</h2>
  </header>

  <!-- filtre des dates -->
  <div class="filtre-dates">
    <strong>Période :</strong>
    <span id="annee_debut"></span> – <span id="annee_fin"></span>
    <div class="double-slider">
      <input id="slider_debut" type="range" step="1" />
      <input id="slider_fin" type="range" step="1" />
    </div>
    <label><input type="checkbox" id="sans_date" checked> photos sans date</label>
    <span id="compte" class="compte"></span>
  </div>

  <div class="main">
    <!-- carte à gauche -->
    <div id="map"></div>

    <!-- colonne d'informations à droite -->
    <aside class="sidebar">
      <div id="infos">
        <p class="vide">Aucune photo sélectionnée.<br>Cliquer sur un point de la carte.</p>
      </div>

      <div class="legende">
        <div><span class="pastille prise_de_vue"></span>Lieu de prise de vue</div>
        <div><span class="pastille represente"></span>Lieu représenté (prise de vue inconnue)</div>
        <p id="resume"></p>
      </div>

      <div class="copyright">© Data: swisstopo – Ortsfinder-Prototyp, résultats à vérifier</div>
    </aside>
  </div>

  <script src="index.js"></script>
</body>

</html>
